# The Claude Code hook users install (public/claude-code/dearkarl-check.sh)
# has to work with the date of both macOS (BSD) and Linux (GNU). Run its
# tests on both.
name: hook script

on:
  push:
    paths:
      - "public/claude-code/**"
      - "test/dearkarl-check-script.test.ts"
      - ".github/workflows/hook-script.yml"
  pull_request:
    paths:
      - "public/claude-code/**"
      - "test/dearkarl-check-script.test.ts"
      - ".github/workflows/hook-script.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash --version | head -1 && date --version 2>/dev/null | head -1 || echo "BSD date"
      - run: pnpm exec vitest run test/dearkarl-check-script.test.ts

  # ubuntu-latest now ships uutils date; Debian still has GNU coreutils,
  # which is what most Linux machines run.
  gnu-coreutils:
    runs-on: ubuntu-latest
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: bash --version | head -1 && date --version | head -1
      - run: pnpm exec vitest run test/dearkarl-check-script.test.ts
